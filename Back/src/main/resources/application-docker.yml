# Back/src/main/resources/application-docker.yml

# ===========================================
# SECTION FIREBASE - CORRIGÉE
# ===========================================
firebase:
  service-account: /app/cloud-web-mobile-firebase-adminsdk-fbsvc-25a331b444.json  # ← Chemin ABSOLU dans Docker
  enabled: ${FIREBASE_ENABLED:false}  # ← Désactivé par défaut pour tester

# ===========================================
# SECTION SPRING (configuration principale)
# ===========================================
spring:
  application:
    name: cloud-web-api
  
  # DATASOURCE
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:StrongPassword123!}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
  
  # JPA / HIBERNATE
  jpa:
    hibernate:
      ddl-auto: update  # ou 'validate' en production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:public}
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ===========================================
# SECTION SERVER
# ===========================================
server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api  # Toutes les URLs commencent par /api

# ===========================================
# SECTION APPLICATION CONFIG (votre app)
# ===========================================
app:
  # JWT CONFIGURATION
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-this-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24h en ms
    issuer: ${JWT_ISSUER:cloudweb-api}
  
  # FIREBASE CONFIG (pour les services qui utilisent app.firebase.*)
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    private-key-id: ${FIREBASE_PRIVATE_KEY_ID:}
    private-key: ${FIREBASE_PRIVATE_KEY:}
    client-email: ${FIREBASE_CLIENT_EMAIL:}
    client-id: ${FIREBASE_CLIENT_ID:}
    client-x509-cert-url: ${FIREBASE_CLIENT_X509_CERT_URL:}
  
  # SECURITY
  security:
    login-attempts-limit: ${LOGIN_ATTEMPTS_LIMIT:3}
    account-lock-duration: ${ACCOUNT_LOCK_DURATION_MINUTES:30}
  
  # CORS
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===========================================
# SECTION LOGGING
# ===========================================
logging:
  level:
    root: INFO
    com.cloudweb: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: ${SPRING_JPA_SHOW_SQL:false}
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"