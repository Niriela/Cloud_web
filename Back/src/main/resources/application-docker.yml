# application-docker.yml
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:authdb}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:public}
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:default-jwt-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: ${JWT_ISSUER:cloudweb-api}
  
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    private-key-id: ${FIREBASE_PRIVATE_KEY_ID:}
    private-key: ${FIREBASE_PRIVATE_KEY:}
    client-email: ${FIREBASE_CLIENT_EMAIL:}
    client-id: ${FIREBASE_CLIENT_ID:}
    client-x509-cert-url: ${FIREBASE_CLIENT_X509_CERT_URL:}
  
  security:
    login-attempts-limit: ${LOGIN_ATTEMPTS_LIMIT:3}
    account-lock-duration: ${ACCOUNT_LOCK_DURATION_MINUTES:30}
  
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.cloudweb: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: ${SPRING_JPA_SHOW_SQL:false}
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE