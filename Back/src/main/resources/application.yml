spring:
  application:
    name: cloud-web-api
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: your_secret_key_change_this_in_production_with_a_long_random_string_at_least_256_bits
  expiration: 86400000 # 24 hours in milliseconds

logging:
  level:
    root: INFO
    com.cloudweb: DEBUG
