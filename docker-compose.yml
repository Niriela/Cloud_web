services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-cloudweb}-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:${DB_CONTAINER_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d  # Optionnel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudweb-network
    restart: unless-stopped

  backend:
    build: ./Back
    container_name: ${COMPOSE_PROJECT_NAME:-cloudweb}-api
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      # Configuration Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8080
      
      # Database
      DB_HOST: postgres  # Nom du service Docker
      DB_PORT: ${DB_CONTAINER_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION_MS}
      JWT_ISSUER: ${JWT_ISSUER}
      
      # Firebase
      FIREBASE_ENABLED: ${FIREBASE_ENABLED}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      
      # Sécurité
      LOGIN_ATTEMPTS_LIMIT: ${LOGIN_ATTEMPTS_LIMIT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudweb-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Front
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${REACT_APP_API_URL_DOCKER}
    container_name: ${COMPOSE_PROJECT_NAME:-cloudweb}-frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"  # Gardez 80 car Nginx écoute sur 80
    environment:
      # Variables pour Vite
      VITE_API_URL: ${REACT_APP_API_URL_DOCKER}
      VITE_APP_NAME: ${REACT_APP_NAME}
      VITE_APP_VERSION: ${REACT_APP_VERSION}
      VITE_APP_ENV: ${REACT_APP_ENV}
    depends_on:
      - backend
    networks:
      - cloudweb-network
    restart: unless-stopped

networks:
  cloudweb-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-cloudweb}-network

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-cloudweb}-postgres-data