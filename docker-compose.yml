services:
  # -------------------------
  # Base de données PostgreSQL
  # -------------------------
  db:
    image: postgres:16-alpine
    container_name: cloudweb-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cloud_db}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # Backend Spring Boot
  # -------------------------
  backend:
    container_name: cloudweb-backend
    build:
      context: ./Back
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-cloud_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: ${JWT_SECRET:-your_secret_key_change_this_in_production_with_a_long_random_string_at_least_256_bits}
      JWT_EXPIRATION: ${JWT_EXPIRATION_MS:-86400000}
    volumes:
      - ./Back/src:/app/src
      - ./Back/pom.xml:/app/pom.xml
      - maven_repo:/root/.m2
      - ./Back/target:/app/target
    command: mvn spring-boot:run

  # -------------------------
  # Frontend React + Vite
  # -------------------------
  frontend:
    container_name: cloudweb-frontend
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./Front:/app
      - /app/node_modules
      - npm_cache:/root/.npm
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8080/api
      - VITE_APP_NAME=${REACT_APP_NAME:-CloudWeb}
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

  # -------------------------
  # OSM IMPORT (doit finir avant OSM Server)
  # -------------------------
  osm-import:
    image: overv/openstreetmap-tile-server
    container_name: osm_import
    volumes:
      - ./Osm-server/data/madagascar.osm.pbf:/data/region.osm.pbf
      - osm_data:/data/database
    environment:
      - SKIP_EXTERNAL_DATA=true
    command: import
    restart: "no"

  # -------------------------
  # OSM TILE SERVER
  # -------------------------
  osm-server:
    image: overv/openstreetmap-tile-server
    container_name: osm_server
    volumes:
      - osm_data:/data/database
    ports:
      - "${OSM_PORT:-8090}:80"
    command: run
    depends_on:
      osm-import:
        condition: service_completed_successfully

# -------------------------
# Volumes persistants
# -------------------------
volumes:
  postgres_data:
  maven_repo:
  npm_cache:
  osm_data: