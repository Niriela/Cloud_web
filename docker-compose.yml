services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-cloudweb}-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:${DB_CONTAINER_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d  # Optionnel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudweb-network
    restart: unless-stopped

  backend:
    build:
      context: .  # ⬅️ IMPORTANT: Contexte à la racine
      dockerfile: Back/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-cloudweb}-api
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8083"
    environment:
      # Configuration Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8083
      
      # Database
      DB_HOST: postgres  # Nom du service Docker
      DB_PORT: ${DB_CONTAINER_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION_MS}
      JWT_ISSUER: ${JWT_ISSUER}
      
      # Firebase - IMPORTANT: par défaut false dans Dockerfile
      FIREBASE_ENABLED: ${FIREBASE_ENABLED}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      
      # Sécurité
      LOGIN_ATTEMPTS_LIMIT: ${LOGIN_ATTEMPTS_LIMIT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudweb-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${REACT_APP_API_URL_DOCKER}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    container_name: ${COMPOSE_PROJECT_NAME:-cloudweb}-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - cloudweb-network
    restart: unless-stopped
    # Variables pour le runtime (peuvent être différentes)
    environment:
      NODE_ENV: production

networks:
  cloudweb-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-cloudweb}-network

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-cloudweb}-postgres-data